name: gaming-clipper
services:
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: clipper
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: ${CLIPPER_DB_PASSWORD:?Set CLIPPER_DB_PASSWORD in .env}
    volumes:
      - clipper_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper -d clipper"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  clipper_pg:
    name: gaming_clipper_postgres_data
