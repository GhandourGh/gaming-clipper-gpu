[project]
name = "clipper-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "psycopg[binary,pool]>=3.2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",
  "mlx-whisper>=0.4; platform_system == 'Darwin'",
  "faster-whisper>=1.1; platform_system != 'Darwin'",
  "httpx>=0.27",
  "yt-dlp[default]>=2026.10.26",
  "torch>=2.15.0",
  "transformers>=5.23.0",
  "pyobjc-framework-vision>=13.0; platform_system == 'Darwin'",
]
[dependency-groups]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
